<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Form</title>
    <link href="/static/styles.css" rel="stylesheet">
</head>
<body>
<div>
    <p>Please enter your name and pick the Sectors you are currently involved in.</p>
    <form action="/form" method="post">
        <label>Name:
            <input id="name" name="name" th:value="${response.name}" type="text">
        </label>
        <label for="sectors">Sectors:</label>
        <select id="sectors" multiple name="sectors" size="5">
            <option
                    th:each="sector : ${sectors}"
                    th:selected="${response.sectorIds.contains(sector.id)}"
                    th:text="${sector.label}"
                    th:value="${sector.id}"
            ></option>
        </select>

        <label class="terms" for="terms">
            <input id="terms" name="terms" th:checked="${response.agreedToTerms == 1}" type="checkbox" value="1">
            Agree to terms
        </label>

        <input type="submit" value="Save">
    </form>
</div>
</body>
</html>
