<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Form</title>
    <link href="/static/styles.css" rel="stylesheet">
    <script type="application/javascript">
        document.addEventListener('DOMContentLoaded', () => {
            const sectors = document.getElementById('sectors')

            fetch(
                "/sectors",
                {headers: {'Accept': 'application/json'}}
            ).then(response => {
                return response.json()
            }).then(data => {
                const depthBySectorId = new Map()

                data.forEach(sector => {
                    const isRoot = sector.parentId === null || sector.parentId === undefined
                    const depth = isRoot
                        ? 0
                        : (depthBySectorId.get(sector.parentId) ?? 0) + 1
                    const option = document.createElement('option');

                    depthBySectorId.set(sector.id, depth)
                    option.setAttribute('value', sector.id)
                    option.textContent = depth === 0
                        ? sector.name
                        : `${'\u00a0\u00a0\u00a0'.repeat(depth)} ${sector.name}`
                    sectors.appendChild(option)
                })
            })
        })
    </script>
</head>
<body>
<div>
    <p>Please enter your name and pick the Sectors you are currently involved in.</p>
    <form action="/sessions" method="post">
        <label>Name:
            <input id="name" name="name" type="text">
        </label>
        <label for="sectors">Sectors:</label>
        <select id="sectors" multiple name="sectors" size="5"></select>

        <label class="terms" for="terms">
            <input id="terms" name="terms" type="checkbox">
            Agree to terms
        </label>

        <input type="submit" value="Save">
    </form>
</div>
</body>
</html>
